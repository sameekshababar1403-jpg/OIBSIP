<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Professional Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="calculator-container">

        <section class="calculator" aria-label="Calculator">

            <div class="calculator-header">
                <span class="calculator-title">Calculator</span>
                <span class="calculator-status">Ready</span>
            </div>

            <div
    class="display"
    role="status"
    aria-live="polite"
    aria-label="Calculator display">
                <div class="previous-display" id="previousDisplay"></div>
                <div class="current-display" id="currentDisplay">0</div>
            </div>

            <div class="buttons">

                <button
    class="calculator-button function"
    data-action="clear"
    aria-label="Clear calculator">
    C
</button>

                <button
    class="calculator-button function"
    data-action="backspace"
    aria-label="Delete last digit">
    ⌫
</button>

                <button
    class="calculator-button operator"
    data-operator="÷"
    aria-label="Divide">
    ÷
</button>

                <button
    class="calculator-button operator"
    data-operator="×"
    aria-label="Multiply">
    ×
</button>

                <button class="calculator-button number" data-number="7">
                    7
                </button>

                <button class="calculator-button number" data-number="8">
                    8
                </button>

                <button class="calculator-button number" data-number="9">
                    9
                </button>

                <button
    class="calculator-button operator"
    data-operator="-"
    aria-label="Subtract">
    −
</button>

                <button class="calculator-button number" data-number="4">
                    4
                </button>

                <button class="calculator-button number" data-number="5">
                    5
                </button>

                <button class="calculator-button number" data-number="6">
                    6
                </button>

                <button
    class="calculator-button operator"
    data-operator="+"
    aria-label="Add">
    +
</button>

                <button class="calculator-button number" data-number="1">
                    1
                </button>

                <button class="calculator-button number" data-number="2">
                    2
                </button>

                <button class="calculator-button number" data-number="3">
                    3
                </button>

                <button
    class="calculator-button equals"
    data-action="calculate"
    aria-label="Calculate result">
    =
</button>

                <button class="calculator-button number zero" data-number="0">
                    0
                </button>

                <button class="calculator-button number" data-action="decimal">
                    .
                </button>

            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
