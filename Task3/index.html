<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="A professional To-Do Web App for managing daily tasks."
    >

    <title>To-Do Web App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <header class="app-header">
            <p class="eyebrow">TASK MANAGER</p>
            <h1>My To-Do List</h1>
            <p class="subtitle">
                Organize your tasks and stay productive.
            </p>
        </header>

        <section class="task-input-section" aria-label="Add a new task">
            <input
                type="text"
                id="taskInput"
                placeholder="What do you need to do?"
                maxlength="100"
            >

            <button id="addTaskBtn" type="button">
                Add Task
            </button>
        </section>

        <section class="task-summary" aria-label="Task summary">
            <div class="summary-card">
                <span id="pendingCount">0</span>
                <p>Pending</p>
            </div>

            <div class="summary-card">
                <span id="completedCount">0</span>
                <p>Completed</p>
            </div>

            <div class="summary-card">
                <span id="totalCount">0</span>
                <p>Total</p>
            </div>
        </section>

        <section class="tasks-section" aria-labelledby="tasks-heading">
            <div class="section-heading">
                <h2 id="tasks-heading">My Tasks</h2>
            </div>

            <div id="taskList" class="task-list">
                <p class="empty-message">
                    No tasks yet. Add your first task!
                </p>
            </div>
        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
